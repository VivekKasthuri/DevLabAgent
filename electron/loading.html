<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DevLab — Starting…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f; color: #d4d4d4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; gap: 24px;
      -webkit-app-region: drag;
    }
    .logo { font-size: 48px; }
    h1 { font-size: 22px; font-weight: 600; color: #a78bfa; letter-spacing: -0.5px; }
    p  { font-size: 13px; color: #6b6b6b; }
    .dots span {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: #a78bfa; margin: 0 3px;
      animation: pulse 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%,80%,100% { opacity:.2; transform: scale(.8); }
      40% { opacity:1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="logo">💻</div>
  <h1>DevLab</h1>
  <div class="dots"><span></span><span></span><span></span></div>
  <p>Starting agent server…</p>
</body>
</html>
